apiVersion: v1alpha1
kind: Installation
metadata:
  name: signoz
spec:
  deployment:
    flavor: compose
    mode: docker
  mcp:
    spec:
      enabled: true
  signoz:
    spec:
      env:
        SIGNOZ_SQLSTORE_PROVIDER: "${SIGNOZ_SQLSTORE_PROVIDER:-postgres}"
        SIGNOZ_SQLSTORE_POSTGRES_DSN: "${SIGNOZ_SQLSTORE_POSTGRES_DSN}"
  metastore:
    kind: postgres
    spec:
      enabled: false
      cluster:
        replicas: 0
